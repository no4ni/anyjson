<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyJSON // Jericho Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1220'/%3E%3Cpath d='M16 2 28 9v14L16 30 4 23V9Z' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f472b6'/%3E%3C/svg%3E">
<style>
/* Палитра консоли: глубокий navy + электрические акценты по ролям */
:root{
  --bg0:#060a13; --bg1:#0b1220; --surface:#101a2e; --surface2:#152238;
  --line:#22334f; --line2:#2e4368;
  --text:#e9eef8; --muted:#93a4c3; --dim:#5d6f8f;
  --cyan:#22d3ee; --blue:#60a5fa; --green:#4ade80; --amber:#fbbf24;
  --magenta:#f472b6; --red:#f87171; --violet:#a78bfa;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:linear-gradient(160deg,var(--bg0),var(--bg1) 60%,#0a1020);
  color:var(--text); font:15px/1.55 "Segoe UI",system-ui,sans-serif;
  overflow:hidden;
}
/* Слоистый фон: аврора + зерно */
.bg-aurora{position:fixed;inset:-20%;z-index:-2;filter:blur(12px);
  background:
   radial-gradient(40% 35% at 15% 20%,rgba(34,211,238,.16),transparent 60%),
   radial-gradient(35% 30% at 85% 15%,rgba(244,114,182,.13),transparent 60%),
   radial-gradient(45% 40% at 70% 85%,rgba(167,139,250,.13),transparent 60%),
   radial-gradient(30% 30% at 25% 80%,rgba(74,222,128,.09),transparent 60%);
  animation:drift 26s ease-in-out infinite alternate;}
@keyframes drift{to{transform:translate3d(3%,-2%,0) rotate(2deg) scale(1.06)}}
.bg-grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.5'/></svg>");}
/* Кастомные скроллбары в палитре проекта */
*{scrollbar-width:thin;scrollbar-color:var(--line2) var(--bg1)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--line2),var(--line));border-radius:8px;border:2px solid var(--bg1)}
::-webkit-scrollbar-thumb:hover{background:var(--cyan)}
/* Верхняя панель, фиксирована */
.topbar{position:fixed;top:0;left:0;right:0;height:60px;z-index:20;
  display:flex;align-items:center;gap:14px;padding:0 20px;
  background:rgba(11,18,32,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);animation:drop .5s ease both;}
@keyframes drop{from{transform:translateY(-100%);opacity:0}}
.logo{width:30px;height:30px;flex:none}
.brand{font-weight:700;letter-spacing:.14em;font-size:14px}
.brand b{color:var(--cyan)} .brand span{color:var(--dim);font-weight:400}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;
  font:12px var(--mono);color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
body.streaming .dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.eq{display:none;gap:2px;align-items:flex-end;height:12px}
body.streaming .eq{display:inline-flex}
.eq i{width:3px;background:var(--cyan);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
.gen-timer{font:11px var(--mono);color:var(--cyan);min-width:44px;text-align:right}
body:not(.streaming) .gen-timer{display:none}
.tbtn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:8px;padding:6px 12px;font:12px var(--mono);transition:.2s}
.tbtn:hover{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.25)}
/* Раскладка: рельса + сцена */
.layout{display:grid;grid-template-columns:280px 1fr;grid-template-rows:minmax(0,1fr);height:calc(100vh - 60px);margin-top:60px}
.rail{border-right:1px solid var(--line);padding:18px;overflow-y:auto;min-height:0;
  background:rgba(16,26,46,.5);animation:slide .6s .1s ease both;}
@keyframes slide{from{transform:translateX(-24px);opacity:0}}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;
  background:linear-gradient(150deg,var(--surface),var(--surface2));}
.card h3{font:11px var(--mono);letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.agent{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04101c;font-weight:800;font-size:16px}
.agent .nm{font-weight:700}.agent .tg{font:11px var(--mono);color:var(--green)}
.chip{display:block;width:100%;text-align:left;cursor:pointer;margin:6px 0;
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  background:var(--bg1);color:var(--muted);font:12px var(--mono);transition:.2s}
.chip:hover{color:var(--cyan);border-color:var(--cyan);transform:translateX(3px)}
.stats{display:flex;gap:10px}
.stat{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg1)}
.stat b{display:block;font-size:20px;color:var(--cyan)}
.stat span{font:10px var(--mono);color:var(--dim);letter-spacing:.1em}
.hint{font:11px var(--mono);color:var(--dim);line-height:1.7}
.hint b{color:var(--amber)}
/* Сброс сессии: компактная кнопка в правом верхнем углу карточки «Агент» */
.reset-btn{position:absolute;top:10px;right:10px;padding:4px 8px;font-size:13px;line-height:1}
.reset-btn:hover{color:var(--red);border-color:var(--red);box-shadow:0 0 10px rgba(248,113,113,.25)}
/* Живой статус активности агента */
.act{display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--muted)}
.act-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
body.streaming .act-dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.2s infinite}
.act-last{margin-top:8px;font:11px/1.6 var(--mono);color:var(--dim);word-wrap:break-word}
.act-flash{animation:actflash .8s ease}
@keyframes actflash{0%{box-shadow:0 0 0 0 rgba(74,222,128,.45)}100%{box-shadow:0 0 0 16px rgba(74,222,128,0)}}
/* Сцена и чат */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;animation:fade .6s .2s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
.chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 26px}
.msg{border:1px solid var(--line);border-left:3px solid var(--dim);border-radius:12px;
  background:rgba(16,26,46,.72);margin:0 0 14px;padding:12px 14px;
  box-shadow:0 4px 18px rgba(0,0,0,.25);animation:msgin .35s ease both;}
@keyframes msgin{from{opacity:0;transform:translateY(10px)}}
.msg header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ric{font-size:13px}.rname{font:12px var(--mono);letter-spacing:.08em;font-weight:700}
.rtime{margin-left:auto;font:10px var(--mono);color:var(--dim)}
.copy-btn,.fold-btn{cursor:pointer;border:none;background:none;color:var(--dim);font-size:13px;padding:2px 6px;border-radius:6px;transition:.2s}
.copy-btn:hover,.fold-btn:hover{color:var(--cyan);background:var(--surface2)}
.mbody{word-wrap:break-word;white-space:normal}
.msg.user{border-left-color:var(--magenta)} .msg.user .rname{color:var(--magenta)}
.msg.assistant{border-left-color:var(--cyan)} .msg.assistant .rname{color:var(--cyan)}
.msg.tool{border-left-color:var(--green)} .msg.tool .rname{color:var(--green)}
.msg.error{border-left-color:var(--red)} .msg.error .rname{color:var(--red)}
.msg.system{border-left-color:var(--violet)} .msg.system .rname{color:var(--violet)}
.msg.tool pre{font:12px/1.6 var(--mono);color:var(--muted);background:var(--bg1);
  border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;white-space:pre-wrap}
.msg.progress{border-left-color:var(--amber);opacity:.9}
.msg.progress .rname{color:var(--amber)}
.msg.progress pre{font:12px/1.6 var(--mono);color:var(--amber);background:var(--bg1);
  border:1px solid var(--line);border-radius:8px;padding:10px;max-height:120px;overflow:auto;white-space:pre-wrap}
/* Превью вставленных картинок (Ctrl+V) и миниатюры в сообщениях */
.imgbar{display:none;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.imgchip{position:relative}
.imgthumb{max-height:64px;max-width:96px;border:1px solid var(--line);border-radius:8px;display:block}
.imgx{position:absolute;top:-6px;right:-6px;cursor:pointer;border:1px solid var(--red);background:var(--surface);color:var(--red);border-radius:50%;width:20px;height:20px;font-size:11px;line-height:1}
.msg .imgrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.msg .imgrow img{max-height:140px;max-width:60%;border:1px solid var(--line);border-radius:8px}
/* Блок мыслей: янтарный, со сканлайном */
.msg.thought{border-left-color:var(--amber);background:rgba(251,191,36,.05);position:relative;overflow:hidden}
.msg.thought .rname{color:var(--amber)}
.msg.thought .mbody{font-size:13px;color:var(--muted)}
.msg.thought.live::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(251,191,36,.07),transparent);
  animation:scan 2.4s linear infinite;}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
.msg.thought.collapsed .mbody{display:none}
.caret{display:inline-block;width:8px;height:14px;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* Пустое состояние */
.empty{max-width:560px;margin:8vh auto;text-align:center;animation:fade .7s ease both}
.empty h2{font-size:26px;letter-spacing:.06em;margin-bottom:8px}
.empty h2 b{background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
.empty p{color:var(--muted);margin-bottom:18px}
.empty .chip{display:inline-block;width:auto;margin:4px}
/* Кнопка вниз */
.jump{position:absolute;right:26px;bottom:110px;z-index:5;display:none;cursor:pointer;
  border:1px solid var(--cyan);border-radius:999px;padding:8px 14px;
  background:var(--surface);color:var(--cyan);font:12px var(--mono);box-shadow:0 0 14px rgba(34,211,238,.3)}
.jump.show{display:block}
/* Композер */
.composer{border-top:1px solid var(--line);padding:14px 26px;background:rgba(11,18,32,.85);backdrop-filter:blur(8px)}
.crow{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg1);color:var(--text);padding:11px 14px;font-family:inherit;font-size:14px;line-height:1.5;outline:none;transition:.2s}
textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.send{cursor:pointer;border:none;border-radius:10px;padding:11px 22px;font-weight:700;letter-spacing:.06em;
  background:linear-gradient(135deg,var(--cyan),var(--blue),var(--violet));color:#04101c;transition:.2s}
.send:hover{filter:brightness(1.15);box-shadow:0 0 16px rgba(34,211,238,.4)}
.stop{display:none;cursor:pointer;border:1px solid var(--red);border-radius:10px;padding:11px 18px;background:var(--surface);color:var(--red);font-weight:700}
body.streaming .send{display:none} body.streaming .stop{display:block}
.ckey{margin-top:8px;font:10px var(--mono);color:var(--dim)}
.ckey b{color:var(--muted)}

@media (max-width:900px){.layout{grid-template-columns:1fr}.rail{display:none}.chat{padding:16px}.composer{padding:12px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-aurora" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>
<header class="topbar">
  <svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
    <path d="M16 2 28 9v14L16 30 4 23V9Z" stroke="#22d3ee" stroke-width="1.6"/>
    <circle cx="16" cy="16" r="4" fill="#f472b6"/>
    <path d="M16 12V6M16 26v-6M12 14 7 11M25 21l-5-3M12 18l-5 3M25 11l-5 3" stroke="#a78bfa" stroke-width="1.2"/>
  </svg>
  <div class="brand"><b>ANYJSON</b> <span>// JERICHO CONSOLE</span></div>
  <div class="status"><span class="dot"></span><span id="statusText">демон онлайн</span><span class="eq"><i></i><i></i><i></i></span><span class="gen-timer" id="genTimer"></span></div>

</header>
<div class="layout">
  <aside class="rail">
    <div class="card" style="position:relative">
      <h3>Агент</h3>
      <button class="tbtn reset-btn" id="resetSessionBtn" title="Сбросить сессию">🔄</button>
      <div class="agent"><div class="avatar">А</div><div><div class="nm">Аниджсон</div><div class="tg">● persistent daemon</div></div></div>
    </div>
    <div class="card" id="actCard">
      <h3>Активность</h3>
      <div class="act"><span class="act-dot"></span><span id="actText">ожидание</span></div>
      <div class="act-last" id="actLast">инструменты ещё не вызывались</div>
    </div>
    <div class="card">
      <h3>Сессия</h3>
      <div class="stats">
        <div class="stat"><b id="statMsgs">0</b><span>СООБЩЕНИЙ</span></div>
        <div class="stat"><b id="statTools">0</b><span>ВЫЗОВОВ</span></div>
      </div>
    </div>
    <div class="card">
      <h3>История</h3>
      <div class="stat" style="max-width:100%" title="текущие / порог сжатия / окно контекста"><b id="statTokens">0/0/0</b><span>ТОКЕНОВ</span></div>
    </div>
  </aside>
  <main class="stage">
    <div id="chat" class="chat"></div>
    <button class="jump" id="jumpBtn">↓ к последнему</button>
    <footer class="composer">
      <div class="imgbar" id="imgbar"></div>
      <div class="crow">
        <textarea id="input" rows="1" placeholder="Введите сообщение…"></textarea>
        <button class="send" id="sendBtn">SEND ▸</button>
        <button class="stop" id="stopBtn">■ СТОП</button>
      </div>
      <div class="ckey"><b>Enter</b> — отправить · <b>Shift+Enter</b> — новая строка</div>
    </footer>
  </main>
</div>


<script>
const $=s=>document.querySelector(s);
const chat=$('#chat'),input=$('#input');
const ROLES={user:{i:'❯',l:'ОПЕРАТОР'},assistant:{i:'◆',l:'АНИДЖСОН'},tool:{i:'⚙',l:'ИНСТРУМЕНТ'},error:{i:'⚠',l:'ОШИБКА'},system:{i:'⌘',l:'СИСТЕМА'}};
let es=null,streaming=false,nearBottom=true;
let thoughtRaw='',assistantRaw='',curThought=null,curAssistant=null,curProgress=null,pendingImages=[],abortCtrl=null;
let stats={msgs:0,tools:0},serverTokens=0,serverThr=0,serverMax=0;
let scrollPending=false,genTimerId=null,genStart=0;
const now=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const clean=s=>String(s).replace(/\x1b\[[0-9;]*[A-Za-z]/g,'').replace(/\[[0-9;]*m/g,'');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=s=>esc(clean(s)).replace(/\n/g,'<br>');
function updateStats(){$('#statMsgs').textContent=stats.msgs;$('#statTools').textContent=stats.tools;}
// Счётчик токенов приходит с сервера (SSE tokens / поле tokens в /api/history).
// Клиент не сканирует DOM истории: O(1) запись вместо O(n) на каждое сообщение.
const formatK=n=>n<1000?String(n):Math.floor(n/1000)+'К';
function updateTokens(){$('#statTokens').textContent=formatK(serverTokens)+'/'+formatK(serverThr)+'/'+formatK(serverMax);}
function scroll(){if(!nearBottom||scrollPending)return;scrollPending=true;requestAnimationFrame(()=>{scrollPending=false;if(nearBottom)chat.scrollTop=chat.scrollHeight;});}
chat.addEventListener('scroll',()=>{nearBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<80;$('#jumpBtn').classList.toggle('show',!nearBottom);});
$('#jumpBtn').onclick=()=>{nearBottom=true;chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});$('#jumpBtn').classList.remove('show');};
function removeEmpty(){const e=chat.querySelector('.empty');if(e)e.remove();}
function showEmpty(){chat.innerHTML='<div class="empty"><h2>Связь с <b>Аниджсоном</b> установлена</h2><p>Локальный агент с постоянным демоном. Говори обычным языком — команды агент выбирает сам.</p><button class="chip" data-say="Сколько времени?">Сколько времени?</button><button class="chip" data-say="Что ты умеешь?">Что ты умеешь?</button></div>';}
function copyText(t,btn){const done=()=>{btn.textContent='✓';setTimeout(()=>btn.textContent='⧉',1200);};
 if(navigator.clipboard){navigator.clipboard.writeText(t).then(done).catch(()=>{});}else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done();}}
function addMsg(role,text,index,images){removeEmpty();const m=ROLES[role]||{i:'•',l:String(role).toUpperCase()};
 const a=document.createElement('article');a.className='msg '+role;
 if(index!==undefined)a.dataset.index=index;
 let extraBtns='';
 if(role==='user'){extraBtns='<button class="copy-btn" title="Редактировать" style="margin-right:4px;" data-action="edit" data-old-text="'+esc(text)+'">✎</button>';}
 a.innerHTML='<header><span class="ric">'+m.i+'</span><span class="rname">'+m.l+'</span><span class="rtime">'+now()+'</span>'+extraBtns+'<button class="copy-btn" title="Копировать">⧉</button></header><div class="mbody"></div>';
 const b=a.querySelector('.mbody');
 if(role==='tool'){const p=document.createElement('pre');p.textContent=clean(text);b.appendChild(p);}else b.innerHTML=fmt(text);
 if(images&&images.length){const row=document.createElement('div');row.className='imgrow';images.forEach(u=>{const im=document.createElement('img');im.src=u;row.appendChild(im);});b.appendChild(row);}
 a._raw=clean(text);
 const copyBtn=a.querySelector('.copy-btn[title="Копировать"]');
 if(copyBtn)copyBtn.onclick=()=>copyText(a._raw,copyBtn);
 const editBtn=a.querySelector('[data-action="edit"]');
 if(editBtn)editBtn.onclick=()=>editMsg(editBtn,text);
 chat.appendChild(a);stats.msgs++;updateStats();updateTokens();scroll();return a;}
function editMsg(btn,oldText){
 const msg=btn.closest('.msg');const mbody=msg.querySelector('.mbody');const originalHtml=mbody.innerHTML;
 mbody.innerHTML='<textarea class="edit-area" style="width:100%;min-height:60px;background:var(--bg1);color:var(--text);border:1px solid var(--cyan);border-radius:6px;padding:8px;font-family:inherit;font-size:14px;resize:vertical;">'+esc(oldText)+'</textarea><div style="margin-top:8px;display:flex;gap:8px;"><button class="tbtn" style="color:var(--green);border-color:var(--green);" id="saveEdit">💾 Сохранить и перезапустить</button><button class="tbtn" style="color:var(--red);border-color:var(--red);" id="cancelEdit">✕ Отмена</button></div>';
 const textarea=mbody.querySelector('.edit-area');textarea.focus();textarea.setSelectionRange(textarea.value.length,textarea.value.length);
 mbody.querySelector('#cancelEdit').onclick=()=>{mbody.innerHTML=originalHtml;};
 mbody.querySelector('#saveEdit').onclick=async()=>{
  const newText=textarea.value.trim();
  if(!newText||newText===oldText){mbody.innerHTML=originalHtml;return;}
  const saveBtn=mbody.querySelector('#saveEdit');saveBtn.textContent='⏳ Сохранение...';saveBtn.disabled=true;
  try{
   const res=await fetch('/api/edit_message?old_text='+encodeURIComponent(oldText)+'&new_text='+encodeURIComponent(newText));
   if(res.ok){
    let next=msg.nextElementSibling;while(next){const toRemove=next;next=next.nextElementSibling;toRemove.remove();}
    msg.remove();input.value=newText;autoGrow();send();
   }else{alert('Ошибка при редактировании');mbody.innerHTML=originalHtml;}
  }catch(e){alert('Ошибка сети: '+e);mbody.innerHTML=originalHtml;}
 };
}
function makeThought(){const a=document.createElement('article');a.className='msg thought live';
 a.innerHTML='<header><span class="ric">💭</span><span class="rname">МЫСЛИ</span><span class="rtime">'+now()+'</span><button class="fold-btn" title="Свернуть">▾</button></header><div class="mbody"></div>';
 a.querySelector('.fold-btn').onclick=()=>{a.classList.toggle('collapsed');a.querySelector('.fold-btn').textContent=a.classList.contains('collapsed')?'▸':'▾';};
 chat.appendChild(a);scroll();return a;}
function renderThought(t){thoughtRaw+=t;
 if(!curThought){curThought=makeThought();const b=curThought.querySelector('.mbody');b.style.whiteSpace='pre-wrap';curThought._textNode=document.createTextNode('');b.appendChild(curThought._textNode);}
 // Инкрементальный аппенд: только новый чанк в текстовый узел, без innerHTML-пересборки.
 curThought._textNode.appendData(clean(t));scroll();}
function finalizeThought(){if(curThought){curThought.classList.remove('live');curThought.classList.add('collapsed');const fb=curThought.querySelector('.fold-btn');if(fb)fb.textContent='▸';curThought=null;thoughtRaw='';}}
function renderAssistant(t){finalizeThought();assistantRaw+=t;
 if(!curAssistant){curAssistant=addMsg('assistant','');curAssistant.classList.add('streaming');
  const b=curAssistant.querySelector('.mbody');b.style.whiteSpace='pre-wrap';
  // Текстовый узел + каретка создаются один раз; дальше только appendData.
  curAssistant._textNode=document.createTextNode('');b.appendChild(curAssistant._textNode);
  curAssistant._caret=document.createElement('span');curAssistant._caret.className='caret';b.appendChild(curAssistant._caret);}
 const c=clean(t);curAssistant._textNode.appendData(c);curAssistant._raw=(curAssistant._raw||'')+c;scroll();}
function finalizeStreams(){finalizeThought();if(curAssistant){curAssistant.classList.remove('streaming');const b=curAssistant.querySelector('.mbody');b.style.whiteSpace='';b.innerHTML=fmt(assistantRaw);curAssistant._raw=clean(assistantRaw);curAssistant=null;assistantRaw='';}}
function setStreaming(v){streaming=v;document.body.classList.toggle('streaming',v);$('#statusText').textContent=v?'генерация…':'демон онлайн';$('#actText').textContent=v?'генерация…':'ожидание';
 if(v){genStart=performance.now();if(genTimerId)clearInterval(genTimerId);genTimerId=setInterval(()=>{const s=(performance.now()-genStart)/1000;$('#genTimer').textContent=s.toFixed(1)+'s';},100);}else{if(genTimerId){clearInterval(genTimerId);genTimerId=null;}$('#genTimer').textContent='';}}
function renderProgress(t){if(!curProgress){curProgress=document.createElement('article');curProgress.className='msg tool progress';curProgress.innerHTML='<header><span class="ric">⏳</span><span class="rname">ПРОГРЕСС</span><span class="rtime">'+now()+'</span></header><div class="mbody"><pre></pre></div>';chat.appendChild(curProgress);}curProgress.querySelector('pre').textContent=clean(t);$('#actText').textContent='инструмент';$('#actLast').textContent=clean(t).slice(0,90);scroll();}
function clearProgress(){if(curProgress){curProgress.remove();curProgress=null;}}
function finish(){if(es){es.close();es=null;}clearProgress();finalizeStreams();setStreaming(false);}
$('#stopBtn').onclick=()=>{if(abortCtrl)abortCtrl.abort();finish();};
function renderImgBar(){const bar=$('#imgbar');if(!bar)return;bar.innerHTML='';
 pendingImages.forEach((u,idx)=>{const w=document.createElement('div');w.className='imgchip';
 const im=document.createElement('img');im.src=u;im.className='imgthumb';
 const x=document.createElement('button');x.className='imgx';x.textContent='✕';x.title='Убрать';
 x.onclick=()=>{pendingImages.splice(idx,1);renderImgBar();};
 w.appendChild(im);w.appendChild(x);bar.appendChild(w);});
 bar.style.display=pendingImages.length?'flex':'none';}
input.addEventListener('paste',e=>{
 const items=[...(e.clipboardData&&e.clipboardData.items||[])].filter(it=>it.type.startsWith('image/'));
 if(!items.length)return;e.preventDefault();
 items.forEach(it=>{if(pendingImages.length>=4)return;const f=it.getAsFile();if(!f||f.size>12*1024*1024)return;
 const r=new FileReader();r.onload=()=>{if(pendingImages.length<4){pendingImages.push(r.result);renderImgBar();}};r.readAsDataURL(f);});});
function handleEvent(d){
 if(d.type==='thought')renderThought(d.content);
 else if(d.type==='token')renderAssistant(d.content);
 else if(d.type==='progress')renderProgress(d.content);
 else if(d.type==='history_compressed'){
     // Сжатие — серверная оптимизация контекста: DOM истории не трогаем вообще,
     // /api/history не перезапрашиваем. Обновляется только счётчик (O(1)).
     serverTokens=Number(d.tokens)||0;updateTokens();
 }
 else if(d.type==='tool'){clearProgress();finalizeStreams();addMsg('tool',d.content);stats.tools++;updateStats();updateTokens();$('#actText').textContent='инструмент';$('#actLast').textContent=clean(d.content).slice(0,90);const ac=$('#actCard');if(ac){ac.classList.remove('act-flash');void ac.offsetWidth;ac.classList.add('act-flash');}}
 else if(d.type==='tokens'){serverTokens=Number(d.count)||0;serverThr=Number(d.thr)||0;serverMax=Number(d.max)||0;updateTokens();}
 else if(d.type==='error'){clearProgress();finalizeStreams();addMsg('error',d.content);}}
async function send(){const msg=input.value.trim();if(streaming)return;
 const imgs=pendingImages.slice();
 if(msg||imgs.length)addMsg('user',msg,undefined,imgs);
 input.value='';pendingImages=[];renderImgBar();
 try{localStorage.removeItem('aj_draft');}catch(_){}autoGrow();nearBottom=true;setStreaming(true);
 abortCtrl=new AbortController();
 try{
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg,images:imgs}),signal:abortCtrl.signal});
  if(!res.ok||!res.body){addMsg('error','Сервер отклонил запрос ('+res.status+')');finish();return;}
  const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
  while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
   let i;while((i=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);
    const line=chunk.split('\n').find(l=>l.startsWith('data: '));if(!line)continue;const ds=line.slice(6);
    if(ds==='[DONE]'){finish();return;}let d;try{d=JSON.parse(ds);}catch(_){continue;}handleEvent(d);}}
  finish();
 }catch(e){if(e.name!=='AbortError')addMsg('error','Сеть: '+e.message);finish();}}
$('#sendBtn').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
function autoGrow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';}
input.addEventListener('input',()=>{autoGrow();try{localStorage.setItem('aj_draft',input.value);}catch(_){}});
document.addEventListener('click',e=>{const c=e.target.closest('[data-say]');if(c){input.value=c.dataset.say;try{localStorage.setItem('aj_draft',input.value);}catch(_){}input.focus();autoGrow();}});

$('#resetSessionBtn').onclick=async()=>{if(confirm('Сбросить сессию и обновить страницу? История чата будет полностью удалена.')){try{await fetch('/api/reset',{method:'POST'});}catch(_){}location.reload();}};

fetch('/api/history').then(r=>r.json()).then(d=>{
 if(d.messages&&d.messages.length)d.messages.forEach((m,i)=>{let c=m.content,imgs=null;if(Array.isArray(c)){imgs=c.filter(p=>p.type==='image_url').map(p=>p.image_url.url);c=c.filter(p=>p.type==='text').map(p=>p.text).join(' ')||'(изображение)';}addMsg(m.role,c,i,imgs);});else showEmpty();serverTokens=Number(d.tokens)||0;serverThr=Number(d.thr)||0;serverMax=Number(d.max)||0;updateStats();updateTokens();})
 .catch(()=>showEmpty());
try{input.value=localStorage.getItem('aj_draft')||'';}catch(_){}autoGrow();
</script>
</body>
</html>
